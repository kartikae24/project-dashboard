<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Project Management Dashboard — A premium frontend dashboard for organizing, showcasing, and analyzing completed projects." />

  <title>Project Management Dashboard</title>

  <script>
    window.addEventListener('error', function(e) {
      alert('JS Error: ' + e.message + '\nFile: ' + e.filename + '\nLine: ' + e.lineno);
    });
  </script>

  
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  
  
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  
  
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />

  
  
  <link rel="stylesheet" href="css/pages/dashboard.css" />
  <link rel="stylesheet" href="css/pages/library.css" />
  <link rel="stylesheet" href="css/pages/details.css" />
  <link rel="stylesheet" href="css/pages/team.css" />
  <link rel="stylesheet" href="css/pages/tasks.css" />
  <link rel="stylesheet" href="css/pages/calendar.css" />
  <link rel="stylesheet" href="css/pages/analytics.css" />
  <link rel="stylesheet" href="css/pages/settings.css" />

</head>

<body>

  
  <div class="app-container">

    
    
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Sidebar Navigation">
      
    </aside>

    
    <div class="main-content">

      
      
      <header class="topbar" role="banner">
        
      </header>

      
      <main class="page-content" id="page-content" role="main">

        
        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        

        
        <section
          id="page-dashboard"
          class="page-section"
          aria-label="Dashboard"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-library"
          class="page-section"
          aria-label="Project Library"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-details"
          class="page-section"
          aria-label="Project Details"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-team"
          class="page-section"
          aria-label="Team Members"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-tasks"
          class="page-section"
          aria-label="Tasks"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-calendar"
          class="page-section"
          aria-label="Calendar"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-analytics"
          class="page-section"
          aria-label="Analytics"
          aria-hidden="true"
        >
          
        </section>

        
        <section
          id="page-settings"
          class="page-section"
          aria-label="Settings"
          aria-hidden="true"
        >
          
        </section>

      </main>
      

    </div>
    

  </div>
  

  
  
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  
  
  <div id="modal-container"></div>

  

  
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>

  
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>

  
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>

  
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/library.js"></script>
  <script src="js/pages/details.js"></script>
  <script src="js/pages/team.js"></script>
  <script src="js/pages/tasks.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/settings.js"></script>

  
  <script src="js/app.js"></script>

</body>
</html>
